<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector DB RAG Tester</title>
    <meta name="description" content="A premium testing UI for the Vector DB RAG backend.">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Card -->
        <main class="glass-card">
            <header>
                <h1>RAG Vector DB</h1>
                <p>Upload a document to ingest, or type a question to ask the LLM.</p>
            </header>

            <!-- 1. Input Area -->
            <section class="input-section">
                <!-- Toggle between File Upload and Ask Question -->
                <div class="mode-toggle">
                    <button type="button" class="mode-btn active" data-mode="upload">Upload File</button>
                    <button type="button" class="mode-btn" data-mode="ask">Ask Question</button>
                </div>
                
                <div class="input-zones">
                    <div id="upload-zone" class="dropzone active">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p class="drop-text">Drag & drop a file here, or click to browse</p>
                        <p class="supported-formats">Supports PDF, DOCX, XLSX, TXT, MD</p>
                        <input type="file" id="file-input" class="hidden-input" accept=".pdf,.docx,.xlsx,.txt,.csv,.md">
                        <div id="file-name-display" class="file-name-display"></div>
                    </div>

                    <div id="ask-zone" class="textzone">
                        <textarea id="question-input" placeholder="e.g., Summarize the uploaded document..."></textarea>
                    </div>
                </div>
            </section>

            <!-- 2. Chunking Types -->
            <section class="options-section" id="chunking-section">
                <label>Chunking types</label>
                <div class="pill-group" id="chunking-pills">
                    <button type="button" class="pill active" data-value="recursive">Recursive</button>
                    <button type="button" class="pill" data-value="fixed">Fixed</button>
                    <button type="button" class="pill" data-value="sentence">Sentence</button>
                    <button type="button" class="pill" data-value="paragraph">Paragraph</button>
                </div>
            </section>

            <!-- 3. Algorithm Type (Mock/TopK) -->
            <section class="options-section" id="algo-section">
                <label>Vector DB Algorithm (HNSW) / Top K</label>
                <div class="pill-group" id="algo-pills">
                    <button type="button" class="pill" data-value="1">Top 1</button>
                    <button type="button" class="pill" data-value="3">Top 3</button>
                    <button type="button" class="pill active" data-value="5">Top 5</button>
                    <button type="button" class="pill" data-value="10">Top 10</button>
                </div>
            </section>

            <!-- 4. Submit -->
            <section class="submit-section">
                <button type="button" id="submit-btn" class="primary-btn">
                    <span class="btn-text">Submit</span>
                    <div class="spinner"></div>
                </button>
            </section>

            <!-- 5. Result -->
            <section class="result-section">
                <label>Result</label>
                <div class="result-box" id="result-box">
                    <div class="placeholder">Waiting for input...</div>
                </div>
            </section>

        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
